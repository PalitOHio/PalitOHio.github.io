<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Survive The Night</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:black;color:white;overflow:hidden}
#menu,#game{position:fixed;inset:0}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center}
button{padding:14px 30px;font-size:18px;border:none;border-radius:10px;background:#ef4444;color:white;cursor:pointer}
#characters{display:none;gap:10px;margin-top:25px}
.character{width:140px;padding:10px;border:2px solid #444;border-radius:10px;text-align:center;cursor:pointer}
canvas{display:block;margin:auto;background:#111}
#hud{position:fixed;top:10px;left:10px}
#role{position:fixed;top:10px;right:10px}
</style>
</head>

<body>

<div id="menu">
<h1>🔪 SURVIVE THE NIGHT</h1>
<button onclick="openChars()">PLAY</button>
<div id="characters">
<div class="character" onclick="startGame('Runner')">Runner</div>
<div class="character" onclick="startGame('Medic')">Medic</div>
<div class="character" onclick="startGame('Tank')">Tank</div>
<div class="character" onclick="startGame('Sneaky')">Sneaky</div>
</div>
</div>

<div id="game" style="display:none">
<div id="hud">❤️ <span id="hp"></span></div>
<div id="role"></div>
<canvas id="c" width="900" height="550"></canvas>
</div>

<script>
const c=document.getElementById("c"),ctx=c.getContext("2d")
let keys={}
document.onkeydown=e=>keys[e.key]=true
document.onkeyup=e=>keys[e.key]=false

const CLASSES={
Runner:{spd:5,hp:100},
Medic:{spd:6,hp:80},
Tank:{spd:3,hp:150},
Sneaky:{spd:8,hp:90}
}

let player,isKiller,killer,walls=[],survivors=[]

function openChars(){characters.style.display="flex"}

function startGame(cls){
menu.style.display="none"
game.style.display="block"

isKiller=Math.random()<0.2
if(isKiller) cls=Object.keys(CLASSES)[Math.floor(Math.random()*4)]

player={
x:100,y:100,size:20,
spd:CLASSES[cls].spd,
hp:CLASSES[cls].hp
}

killer={
x:700,y:300,size:26,
spd:3,cool:0
}

survivors=[]
for(let i=0;i<3;i++){
survivors.push({
x:200+Math.random()*400,
y:100+Math.random()*300,
size:18,hp:60
})
}

walls=[
{x:300,y:150,w:300,h:20},
{x:300,y:380,w:300,h:20},
{x:200,y:250,w:20,h:150},
{x:680,y:250,w:20,h:150}
]

hp.textContent=player.hp
role.textContent=isKiller?"🔪 KILLER":"🎮 SURVIVOR"

loop()
}

function collide(a,b){
return a.x<a.x+b.w&&a.x+a.size>b.x&&a.y<a.y+b.h&&a.y+a.size>b.y
}

function move(ent,dx,dy){
ent.x+=dx; ent.y+=dy
for(let w of walls){
if(ent.x<w.x+w.w&&ent.x+ent.size>w.x&&ent.y<w.y+w.h&&ent.y+ent.size>w.y){
ent.x-=dx; ent.y-=dy
}
}
}

function update(){
if(isKiller){
if(keys.w) move(killer,0,-killer.spd)
if(keys.s) move(killer,0,killer.spd)
if(keys.a) move(killer,-killer.spd,0)
if(keys.d) move(killer,killer.spd,0)
}else{
if(keys.w) move(player,0,-player.spd)
if(keys.s) move(player,0,player.spd)
if(keys.a) move(player,-player.spd,0)
if(keys.d) move(player,player.spd,0)

let t=[player,...survivors].filter(s=>s.hp>0)
let target=t[Math.floor(Math.random()*t.length)]
let dx=target.x-killer.x,dy=target.y-killer.y
let d=Math.hypot(dx,dy)
if(d>0){
move(killer,dx/d*killer.spd,dy/d*killer.spd)
}

if(d<40 && killer.cool<=0){
target.hp-=15
killer.cool=60
if(target===player){
hp.textContent=player.hp
if(player.hp<=0) end("💀 MORISTE")
}
}
}

if(killer.cool>0) killer.cool--
}

function draw(){
ctx.clearRect(0,0,c.width,c.height)

ctx.fillStyle="#333"
walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h))

ctx.fillStyle="#22c55e"
ctx.fillRect(player.x,player.y,player.size,player.size)

ctx.fillStyle="#0ea5e9"
survivors.forEach(s=>s.hp>0&&ctx.fillRect(s.x,s.y,s.size,s.size))

ctx.fillStyle="#ef4444"
ctx.fillRect(killer.x,killer.y,killer.size,killer.size)
}

function loop(){
update()
draw()
requestAnimationFrame(loop)
}

function end(msg){
alert(msg)
location.reload()
}
</script>

</body>
</html>
