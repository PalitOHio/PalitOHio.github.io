<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Survive The Night</title>

<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }

body {
  margin: 0;
  background: black;
  color: white;
  overflow: hidden;
}

/* ===== MENU ===== */
#menu {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

h1 { font-size: 48px; margin-bottom: 10px; }

button {
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #ef4444;
  color: white;
  cursor: pointer;
  margin-top: 20px;
}

#characters {
  display: none;
  gap: 15px;
  margin-top: 30px;
}

.character {
  width: 140px;
  padding: 15px;
  background: #050505;
  border: 2px solid #555;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
}

.character.selected {
  border-color: #22c55e;
}

/* ===== GAME ===== */
#game {
  display: none;
}

canvas {
  display: block;
  margin: auto;
  background: #111;
}

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
}
</style>
</head>

<body>

<!-- MENU -->
<div id="menu">
  <h1>🔪 SURVIVE THE NIGHT</h1>
  <button onclick="openCharacters()">PLAY</button>

  <div id="characters">
    <div class="character" onclick="selectClass('Runner')">🏃 Runner</div>
    <div class="character" onclick="selectClass('Medic')">💉 Medic</div>
    <div class="character" onclick="selectClass('Tank')">🛡 Tank</div>
    <div class="character" onclick="selectClass('Sneaky')">👁 Sneaky</div>
    <div class="character" onclick="selectClass('Balanced')">⚖ Balanced</div>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div id="hud">❤️ Vida: <span id="hp">100</span></div>
  <canvas id="canvas" width="800" height="500"></canvas>
</div>

<script>
let selectedClass = null;

function openCharacters() {
  document.getElementById("characters").style.display = "flex";
}

function selectClass(cls) {
  selectedClass = cls;
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";
  startGame();
}

/* ===== GAME LOGIC ===== */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

let player, killer;

function startGame() {
  player = { x: 100, y: 100, size: 20, speed: 3, hp: 100 };
  killer = { x: 600, y: 300, size: 25, speed: 2 };

  if (selectedClass === "Runner") player.speed = 4;
  if (selectedClass === "Tank") player.hp = 150;
  if (selectedClass === "Medic") player.hp = 120;

  document.getElementById("hp").textContent = player.hp;
  loop();
}

function update() {
  if (keys["w"] || keys["ArrowUp"]) player.y -= player.speed;
  if (keys["s"] || keys["ArrowDown"]) player.y += player.speed;
  if (keys["a"] || keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["d"] || keys["ArrowRight"]) player.x += player.speed;

  // Killer follows player
  let dx = player.x - killer.x;
  let dy = player.y - killer.y;
  let dist = Math.hypot(dx, dy);

  if (dist > 0) {
    killer.x += dx / dist * killer.speed;
    killer.y += dy / dist * killer.speed;
  }

  // Collision
  if (dist < player.size + killer.size) {
    player.hp -= 0.5;
    document.getElementById("hp").textContent = Math.floor(player.hp);
    if (player.hp <= 0) gameOver();
  }
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(player.x, player.y, player.size, player.size);

  // Killer
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(killer.x, killer.y, killer.size, killer.size);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  alert("💀 HAS MUERTO");
  location.reload();
}
</script>

</body>
</html>
