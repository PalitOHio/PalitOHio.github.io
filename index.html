<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Survive The Night</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:black;color:white;overflow:hidden}
#menu,#game{position:fixed;inset:0}
#menu{display:flex;flex-direction:column;align-items:center;justify-content:center}
button{
  padding:14px 30px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#ef4444;
  color:white;
  cursor:pointer
}
#characters{display:none;gap:10px;margin-top:25px}
.character{
  width:140px;
  padding:10px;
  border:2px solid #444;
  border-radius:10px;
  text-align:center;
  cursor:pointer
}
canvas{display:block;margin:auto;background:#111}
#hud{position:fixed;top:10px;left:10px}
#role{position:fixed;top:10px;right:10px}
</style>
</head>

<body>

<div id="menu">
  <h1>🔪 SURVIVE THE NIGHT</h1>
  <button onclick="openChars()">PLAY</button>
  <div id="characters">
    <div class="character" onclick="startGame('Runner')">Runner</div>
    <div class="character" onclick="startGame('Medic')">Medic</div>
    <div class="character" onclick="startGame('Tank')">Tank</div>
    <div class="character" onclick="startGame('Sneaky')">Sneaky</div>
  </div>
</div>

<div id="game" style="display:none">
  <div id="hud">❤️ <span id="hp"></span></div>
  <div id="role"></div>
  <canvas id="c" width="900" height="550"></canvas>
</div>

<script>
const c=document.getElementById("c")
const ctx=c.getContext("2d")

let keys={}
document.onkeydown=e=>keys[e.key]=true
document.onkeyup=e=>keys[e.key]=false

// ===== CLASES =====
const CLASSES={
  Runner:{spd:3,hp:100},
  Medic:{spd:3.5,hp:80},
  Tank:{spd:1,hp:150},
  Sneaky:{spd:4,hp:90}
}

let player,isKiller,killer,walls=[],survivors=[]

// ===== MENU =====
function openChars(){ characters.style.display="flex" }

// ===== START GAME =====
function startGame(cls){
  menu.style.display="none"
  game.style.display="block"

  isKiller=Math.random()<0.2
  if(isKiller) cls=Object.keys(CLASSES)[Math.floor(Math.random()*4)]

  player={x:120,y:120,size:20,spd:CLASSES[cls].spd,hp:CLASSES[cls].hp}

  killer={x:750,y:300,size:26,spd:5,cool:0}

  survivors=[]
  const spawnX=150, spawnY=150
  for(let i=0;i<4;i++){
    survivors.push({
      x:spawnX+Math.random()*10,
      y:spawnY+Math.random()*10,
      size:18,hp:60,dirX:0,dirY:0
    })
  }

  walls=[
    {x:300,y:150,w:300,h:20},
    {x:300,y:380,w:300,h:20},
    {x:200,y:250,w:20,h:150},
    {x:680,y:250,w:20,h:150}
  ]

  hp.textContent=player.hp
  role.textContent=isKiller?"🔪 KILLER":"🎮 SURVIVOR"
  loop()
}

// ===== LIMITES =====
function clamp(ent){
  ent.x=Math.max(0,Math.min(c.width-ent.size,ent.x))
  ent.y=Math.max(0,Math.min(c.height-ent.size,ent.y))
}

// ===== COLISION =====
function collides(ent){
  return walls.some(w=>
    ent.x<w.x+w.w&&ent.x+ent.size>w.x&&
    ent.y<w.y+w.h&&ent.y+ent.size>w.y
  )
}

function move(ent,dx,dy){
  ent.x+=dx; ent.y+=dy
  if(collides(ent)){ ent.x-=dx; ent.y-=dy }
  clamp(ent)
}

// 🔥 MOVIMIENTO ESPECIAL DEL KILLER
function moveKillerSmart(ent,dx,dy){
  let ox=ent.x, oy=ent.y

  // intento directo
  ent.x+=dx; ent.y+=dy
  if(!collides(ent)){ clamp(ent); return }

  // intento solo X
  ent.x=ox+dx; ent.y=oy
  if(!collides(ent)){ clamp(ent); return }

  // intento solo Y
  ent.x=ox; ent.y=oy+dy
  if(!collides(ent)){ clamp(ent); return }

  // nada funcionó → retrocede
  ent.x=ox; ent.y=oy
}

// ===== UPDATE =====
function update(){

  // CONTROL
  if(isKiller){
    if(keys.w) move(killer,0,-killer.spd)
    if(keys.s) move(killer,0,killer.spd)
    if(keys.a) move(killer,-killer.spd,0)
    if(keys.d) move(killer,killer.spd,0)
  }else{
    if(keys.w) move(player,0,-player.spd)
    if(keys.s) move(player,0,player.spd)
    if(keys.a) move(player,-player.spd,0)
    if(keys.d) move(player,player.spd,0)
  }

  // SURVIVORS IA
  survivors.forEach(s=>{
    if(s.hp<=0) return
    let dx=s.x-killer.x, dy=s.y-killer.y
    let d=Math.hypot(dx,dy)
    if(d<180){
      move(s,(dx/d)*2,(dy/d)*2)
    }else{
      if(Math.random()<0.02){
        s.dirX=Math.random()*2-1
        s.dirY=Math.random()*2-1
      }
      move(s,s.dirX*1.2,s.dirY*1.2)
    }
  })

  // 🔴 KILLER IA INTELIGENTE
  if(!isKiller){
    let targets=[player,...survivors].filter(t=>t.hp>0)
    let target=targets.reduce((a,b)=>{
      return Math.hypot(b.x-killer.x,b.y-killer.y)
           < Math.hypot(a.x-killer.x,a.y-killer.y) ? b : a
    })

    let dx=target.x-killer.x
    let dy=target.y-killer.y
    let d=Math.hypot(dx,dy)

    if(d>1){
      moveKillerSmart(killer,(dx/d)*killer.spd,(dy/d)*killer.spd)
    }

    if(d<40 && killer.cool<=0){
      target.hp-=15
      killer.cool=45
      if(target===player){
        hp.textContent=player.hp
        if(player.hp<=0) end("💀 MORISTE")
      }
    }
  }

  if(killer.cool>0) killer.cool--
}

// ===== DRAW =====
function draw(){
  ctx.clearRect(0,0,c.width,c.height)

  ctx.fillStyle="#333"
  walls.forEach(w=>ctx.fillRect(w.x,w.y,w.w,w.h))

  ctx.fillStyle="#2563eb"
  ctx.fillRect(player.x,player.y,player.size,player.size)

  ctx.fillStyle="#22c55e"
  survivors.forEach(s=>s.hp>0&&ctx.fillRect(s.x,s.y,s.size,s.size))

  ctx.fillStyle="#ef4444"
  ctx.fillRect(killer.x,killer.y,killer.size,killer.size)
}

// ===== LOOP =====
function loop(){
  update()
  draw()
  requestAnimationFrame(loop)
}

function end(msg){
  alert(msg)
  location.reload()
}
</script>

</body>
</html>
