<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Survive The Night</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #020617, #000);
  color: white;
  overflow: hidden;
}

/* ===== MENU ===== */
#menu {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: fadeIn 1s ease;
}

h1 {
  font-size: 48px;
  margin-bottom: 10px;
}

#subtitle {
  opacity: 0.7;
  margin-bottom: 30px;
}

button {
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #ef4444;
  color: white;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
}

button:hover {
  transform: scale(1.1);
  background: #dc2626;
}

/* ===== CHARACTER SELECT ===== */
#characters {
  display: none;
  gap: 20px;
  margin-top: 30px;
}

.character {
  width: 140px;
  padding: 15px;
  background: #020617;
  border: 2px solid #38bdf8;
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}

.character:hover {
  transform: translateY(-10px);
  box-shadow: 0 0 20px #38bdf8;
}

.character.selected {
  border-color: #22c55e;
  box-shadow: 0 0 25px #22c55e;
}

.char-icon {
  font-size: 40px;
  margin-bottom: 10px;
}

/* ===== ANIM ===== */
@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div id="menu">
  <h1>🔪 SURVIVE THE NIGHT</h1>
  <div id="subtitle">Escapa. Sobrevive. No confíes.</div>

  <button onclick="openCharacters()">PLAY</button>

  <div id="characters">
    <div class="character" onclick="selectChar(this, 'Runner')">
      <div class="char-icon">🏃</div>
      Runner
    </div>

    <div class="character" onclick="selectChar(this, 'Medic')">
      <div class="char-icon">💉</div>
      Medic
    </div>

    <div class="character" onclick="selectChar(this, 'Hacker')">
      <div class="char-icon">💻</div>
      Hacker
    </div>
  </div>
</div>

<script>
let selectedCharacter = null;

function openCharacters() {
  document.getElementById("characters").style.display = "flex";
}

function selectChar(el, name) {
  document.querySelectorAll(".character").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  selectedCharacter = name;

  console.log("Personaje elegido:", selectedCharacter);
}
</script>

</body>
</html>
