<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Survive The Night</title>

<style>
* { box-sizing: border-box; font-family: Arial; }
body { margin: 0; background: black; color: white; overflow: hidden; }

#menu {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

button {
  padding: 14px 30px;
  font-size: 18px;
  border: none;
  border-radius: 10px;
  background: #ef4444;
  color: white;
  cursor: pointer;
  margin-top: 20px;
}

#characters {
  display: none;
  gap: 12px;
  margin-top: 30px;
}

.character {
  width: 140px;
  padding: 12px;
  background: #050505;
  border: 2px solid #555;
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
}

#game { display: none; }
canvas { display: block; margin: auto; background: #111; }

#hud {
  position: fixed;
  top: 10px;
  left: 10px;
}

#role {
  position: fixed;
  top: 10px;
  right: 10px;
}
</style>
</head>

<body>

<div id="menu">
  <h1>🔪 SURVIVE THE NIGHT</h1>
  <button onclick="openCharacters()">PLAY</button>

  <div id="characters">
    <div class="character" onclick="start('Runner')">🏃 Runner</div>
    <div class="character" onclick="start('Medic')">💉 Medic</div>
    <div class="character" onclick="start('Tank')">🛡 Tank</div>
    <div class="character" onclick="start('Sneaky')">👁 Sneaky</div>
    <div class="character" onclick="start('Balanced')">⚖ Balanced</div>
  </div>
</div>

<div id="game">
  <div id="hud">❤️ <span id="hp">100</span></div>
  <div id="role"></div>
  <canvas id="canvas" width="800" height="500"></canvas>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key] = true);
document.addEventListener("keyup", e => keys[e.key] = false);

let player, killer;
let isKiller = false;

function openCharacters() {
  document.getElementById("characters").style.display = "flex";
}

function start(selectedClass) {
  document.getElementById("menu").style.display = "none";
  document.getElementById("game").style.display = "block";

  isKiller = Math.random() < 0.2;

  if (isKiller) {
    selectedClass = ["Runner","Medic","Tank","Sneaky","Balanced"]
      [Math.floor(Math.random()*5)];
  }

  initGame(selectedClass);
}

function initGame(cls) {
  player = { x: 100, y: 100, size: 20, speed: 3, hp: 100 };
  killer = {
    x: 600, y: 300, size: 26,
    speed: 3,
    cooldown: 0,
    rage: 0
  };

  if (cls === "Runner") player.speed = 4;
  if (cls === "Tank") player.hp = 150;
  if (cls === "Medic") player.hp = 120;

  document.getElementById("hp").textContent = player.hp;
  document.getElementById("role").textContent =
    isKiller ? "🔪 ROLE: KILLER (WASD + CLICK)" : "🎮 ROLE: SURVIVOR";

  loop();
}

canvas.addEventListener("mousedown", () => {
  if (isKiller && killer.cooldown <= 0) {
    const dx = player.x - killer.x;
    const dy = player.y - killer.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 50) {
      player.hp -= 20;
      document.getElementById("hp").textContent = player.hp;
      if (player.hp <= 0) end("💀 HAS MUERTO");
    }
    killer.cooldown = 60;
  }
});

function update() {
  if (isKiller) {
    if (keys["w"]||keys["ArrowUp"]) killer.y -= killer.speed;
    if (keys["s"]||keys["ArrowDown"]) killer.y += killer.speed;
    if (keys["a"]||keys["ArrowLeft"]) killer.x -= killer.speed;
    if (keys["d"]||keys["ArrowRight"]) killer.x += killer.speed;
  } else {
    if (keys["w"]||keys["ArrowUp"]) player.y -= player.speed;
    if (keys["s"]||keys["ArrowDown"]) player.y += player.speed;
    if (keys["a"]||keys["ArrowLeft"]) player.x -= player.speed;
    if (keys["d"]||keys["ArrowRight"]) player.x += player.speed;

    let dx = player.x - killer.x;
    let dy = player.y - killer.y;
    let dist = Math.hypot(dx, dy);
    killer.x += dx / dist * killer.speed;
    killer.y += dy / dist * killer.speed;
  }

  if (keys[" "] && killer.rage <= 0) {
    killer.speed = 5;
    killer.rage = 120;
  }

  if (killer.cooldown > 0) killer.cooldown--;
  if (killer.rage > 0 && --killer.rage === 0) killer.speed = 3;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.fillStyle = "#22c55e";
  ctx.fillRect(player.x, player.y, player.size, player.size);

  ctx.fillStyle = "#ef4444";
  ctx.fillRect(killer.x, killer.y, killer.size, killer.size);
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

function end(msg) {
  alert(msg);
  location.reload();
}
</script>

</body>
</html>
